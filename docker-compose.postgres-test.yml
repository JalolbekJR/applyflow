name: applyflow-postgres-test

services:
  postgres-test:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${APPLYFLOW_POSTGRES_DB:-applyflow_postgres_verification}
      POSTGRES_USER: ${APPLYFLOW_POSTGRES_USER:-applyflow_test}
      POSTGRES_PASSWORD: ${APPLYFLOW_POSTGRES_PASSWORD:-applyflow_test_password}
    ports:
      - "127.0.0.1:${APPLYFLOW_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
